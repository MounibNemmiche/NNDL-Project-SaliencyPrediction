# CLI arguments override these portable project defaults.
data:
  train_image_dir: "dataset/images/images/train"
  train_map_dir: "dataset/maps/train"
  val_image_dir: "dataset/images/images/val"
  val_map_dir: "dataset/maps/val"
  test_image_dir: "dataset/images/images/test"
  val_manifest: "data/splits/val_seed42.txt"
  test_manifest: "data/splits/test_seed42.txt"

preprocessing:
  image_size: 224
  augmentation:
    horizontal_flip: true

model:
  name: "fusion"

training:
  epochs: 20
  batch_size: 8
  learning_rate: 1.0e-4
  seed: 42
  loss: "mse"
  lambda_cc: 0.1
  train_samples: null
  val_samples: null
  num_workers: 0
  device: "auto"
  amp: false

evaluation:
  test_samples: null
  batch_size: 8

outputs:
  root_dir: "outputs/runs"
  visualization_dir: "outputs/visualizations"
